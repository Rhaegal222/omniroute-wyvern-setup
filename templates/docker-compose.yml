version: '3.8'
services:
  omniroute:
    image: wyrmrest/omniroute:3.8.51
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
    volumes:
      - ./config.json:/home/node/.omniroute/config.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
